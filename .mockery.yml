# Mockery v3 Configuration
# Documentation: https://vektra.github.io/mockery/latest/configuration/

all: false
dir: "internal/mocks/{{.InterfaceName}}"
filename: "mock_{{.InterfaceName}}.go"
structname: "Mock{{.InterfaceName}}"
pkgname: mocks
recursive: false
log-level: info
template: testify

packages:
  github.com/unser-elefant/remnawave-go/internal/service:
    interfaces:
      userAPI:
      deviceAPI:

  github.com/unser-elefant/remnawave-go/internal/api:
    interfaces:
      HTTPClient:

